name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.16.0
      - name: Set up Node project
        uses: kellen-miller/ci/.github/actions/setup-node@d1c91763535a5866b55282018f301d921b22bcd5
        with:
          node-version: '24'

      - run: pnpm format:check
      - run: terraform fmt -check -recursive infra

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.16.0
      - name: Set up Node project
        uses: kellen-miller/ci/.github/actions/setup-node@d1c91763535a5866b55282018f301d921b22bcd5
        with:
          node-version: '24'

      - run: pnpm lint
      - run: pnpm typecheck
      - uses: sqlc-dev/setup-sqlc@7247af29a59647b720868511024240c31dd7c411
        with:
          sqlc-version: 1.31.1
      - run: pnpm generate:sql
      - run: git diff --exit-code -- gen/sql
      - run: shellcheck scripts/*.sh
      - run: terraform -chdir=infra/bootstrap init -backend=false
      - run: terraform -chdir=infra/bootstrap validate -no-color
      - run: terraform -chdir=infra/app init -backend=false
      - run: terraform -chdir=infra/app validate -no-color

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Set up Node project
        uses: kellen-miller/ci/.github/actions/setup-node@d1c91763535a5866b55282018f301d921b22bcd5
        with:
          node-version: '24'

      - run: pnpm test:coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Set up Node project
        uses: kellen-miller/ci/.github/actions/setup-node@d1c91763535a5866b55282018f301d921b22bcd5
        with:
          node-version: '24'

      - run: pnpm build
      - run: docker build --tag chief:test .
      - run: docker run --rm chief:test smoke
      - name: Smoke native host TypeScript
        run: docker run --rm --entrypoint node --volume "$PWD/src/ops:/workspace/src/ops:ro" --volume "$PWD/gen:/workspace/gen:ro" chief:test /workspace/src/ops/cli.ts configure-github-ruleset --dry-run
