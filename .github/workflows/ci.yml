name: CI
'on':
  pull_request: null
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.paths.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: paths
        uses: kellen-miller/ci/.github/actions/changed-paths@75c70f9d5db7117810669e0af01fd2eafdc396c6
        with:
          filters: |-
            {
              "app": [
                ".github/workflows/**",
                "package.json",
                "pnpm-lock.yaml",
                "pnpm-workspace.yaml",
                "patches/**",
                ".nvmrc",
                ".node-version",
                ".npmrc",
                "src/**",
                "gen/**",
                "sql/**",
                "test/**",
                "scripts/**",
                "Dockerfile",
                ".dockerignore",
                ".env*",
                "tsconfig*",
                "vitest*",
                "eslint*"
              ],
              "tests": [
                ".github/workflows/**",
                "package.json",
                "pnpm-lock.yaml",
                "pnpm-workspace.yaml",
                "patches/**",
                ".nvmrc",
                ".node-version",
                ".npmrc",
                "src/**",
                "gen/**",
                "sql/**",
                "test/**",
                "scripts/**",
                "Dockerfile",
                ".dockerignore",
                ".env*",
                "tsconfig*",
                "vitest*",
                "eslint*",
                "infra/**"
              ],
              "terraform": [
                ".github/workflows/**",
                "package.json",
                "pnpm-lock.yaml",
                "pnpm-workspace.yaml",
                "patches/**",
                ".nvmrc",
                ".node-version",
                ".npmrc",
                "infra/**",
                "scripts/**",
                "src/ops/**",
                "gen/sql/monitoring.ts"
              ],
              "sql": [
                ".github/workflows/**",
                "package.json",
                "pnpm-lock.yaml",
                "pnpm-workspace.yaml",
                "patches/**",
                ".nvmrc",
                ".node-version",
                ".npmrc",
                "sql/**",
                "gen/sql/**",
                "sqlc.yaml",
                ".prettier*"
              ],
              "shell": [
                ".github/workflows/**",
                "package.json",
                "pnpm-lock.yaml",
                "pnpm-workspace.yaml",
                "patches/**",
                ".nvmrc",
                ".node-version",
                ".npmrc",
                "scripts/**",
                ".shellcheckrc"
              ]
            }
  format:
    name: Format
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: v1.16.6
        if: ${{ success() && (needs.changes.result != 'success' || fromJSON(needs.changes.outputs.changes).terraform) }}
      - name: Set up Node project
        uses: kellen-miller/ci/.github/actions/setup-node@d1c91763535a5866b55282018f301d921b22bcd5
        with:
          node-version: '24'
      - run: pnpm format:check
      - run: terraform fmt -check -recursive infra
        if: ${{ success() && (needs.changes.result != 'success' || fromJSON(needs.changes.outputs.changes).terraform) }}
    needs: changes
  lint:
    name: Lint
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: v1.16.6
        if: ${{ success() && (needs.changes.result != 'success' || fromJSON(needs.changes.outputs.changes).terraform) }}
      - name: Set up Node project
        uses: kellen-miller/ci/.github/actions/setup-node@d1c91763535a5866b55282018f301d921b22bcd5
        with:
          node-version: '24'
        if:
          ${{ success() && (needs.changes.result != 'success' || fromJSON(needs.changes.outputs.changes).app || fromJSON(needs.changes.outputs.changes).sql)
          }}
      - run: pnpm lint
        if: ${{ success() && (needs.changes.result != 'success' || fromJSON(needs.changes.outputs.changes).app) }}
      - run: pnpm typecheck
        if: ${{ success() && (needs.changes.result != 'success' || fromJSON(needs.changes.outputs.changes).app) }}
      - uses: sqlc-dev/setup-sqlc@7247af29a59647b720868511024240c31dd7c411
        with:
          sqlc-version: 1.31.1
        if: ${{ success() && (needs.changes.result != 'success' || fromJSON(needs.changes.outputs.changes).sql) }}
      - run: pnpm generate:sql
        if: ${{ success() && (needs.changes.result != 'success' || fromJSON(needs.changes.outputs.changes).sql) }}
      - run: git diff --exit-code -- gen/sql
        if: ${{ success() && (needs.changes.result != 'success' || fromJSON(needs.changes.outputs.changes).sql) }}
      - run: shellcheck scripts/*.sh
        if: ${{ success() && (needs.changes.result != 'success' || fromJSON(needs.changes.outputs.changes).shell) }}
      - run: terraform -chdir=infra/bootstrap init -backend=false
        if: ${{ success() && (needs.changes.result != 'success' || fromJSON(needs.changes.outputs.changes).terraform) }}
      - run: terraform -chdir=infra/bootstrap validate -no-color
        if: ${{ success() && (needs.changes.result != 'success' || fromJSON(needs.changes.outputs.changes).terraform) }}
      - run: terraform -chdir=infra/app init -backend=false
        if: ${{ success() && (needs.changes.result != 'success' || fromJSON(needs.changes.outputs.changes).terraform) }}
      - run: terraform -chdir=infra/app validate -no-color
        if: ${{ success() && (needs.changes.result != 'success' || fromJSON(needs.changes.outputs.changes).terraform) }}
    needs: changes
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node project
        uses: kellen-miller/ci/.github/actions/setup-node@d1c91763535a5866b55282018f301d921b22bcd5
        with:
          node-version: '24'
      - run: pnpm test:coverage
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || fromJSON(needs.changes.outputs.changes).tests) }}
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node project
        uses: kellen-miller/ci/.github/actions/setup-node@d1c91763535a5866b55282018f301d921b22bcd5
        with:
          node-version: '24'
      - run: pnpm build
      - run: docker build --tag chief:test .
      - run: docker run --rm chief:test smoke
      - name: Smoke native host TypeScript
        run:
          docker run --rm --entrypoint node --volume "$PWD/src/ops:/workspace/src/ops:ro" --volume "$PWD/gen:/workspace/gen:ro" chief:test /workspace/src/ops/cli.ts
          configure-github-ruleset --dry-run
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || fromJSON(needs.changes.outputs.changes).app) }}
