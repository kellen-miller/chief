name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: chief-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    environment: production
    env:
      TF_IN_AUTOMATION: 'true'
      TF_VAR_alert_email: ${{ vars.CHIEF_ALERT_EMAIL }}
      TF_VAR_backup_bucket_name: ${{ vars.CHIEF_BACKUP_BUCKET }}
      TF_VAR_discord_application_id: ${{ vars.DISCORD_APPLICATION_ID }}
      TF_VAR_discord_guild_id: ${{ vars.DISCORD_GUILD_ID }}
      TF_VAR_discord_text_channel_id: ${{ vars.DISCORD_MAIN_TEXT_CHANNEL_ID }}
      TF_VAR_discord_voice_channel_id: ${{ vars.DISCORD_MAIN_VOICE_CHANNEL_ID }}
      TF_VAR_discord_monitoring_channel_id: ${{ vars.DISCORD_MONITORING_CHANNEL_ID }}
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_region: ${{ vars.GCP_REGION }}
      TF_VAR_zone: ${{ vars.GCP_ZONE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_PRODUCTION_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TF_APPLY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.15.8

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Plan and apply the merged commit
        working-directory: infra/app
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ vars.GCP_TERRAFORM_STATE_BUCKET }}" \
            -backend-config="prefix=production/app"
          terraform plan -input=false -lock-timeout=5m -out=tfplan
          terraform show -json tfplan > tfplan.json
          ../../scripts/check-terraform-plan.sh tfplan.json
          terraform apply -input=false -lock-timeout=5m tfplan

      - name: Authenticate deployment identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_PRODUCTION_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Reconfigure gcloud deployment identity
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Build and publish immutable image
        id: image
        env:
          IMAGE_REPOSITORY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/chief/chief
        run: |
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
          docker build --platform linux/amd64 --tag "$IMAGE_REPOSITORY:${GITHUB_SHA}" .
          docker push "$IMAGE_REPOSITORY:${GITHUB_SHA}"
          digest="$(gcloud artifacts docker images describe "$IMAGE_REPOSITORY:${GITHUB_SHA}" --format='value(image_summary.digest)')"
          echo "reference=$IMAGE_REPOSITORY@$digest" >>"$GITHUB_OUTPUT"

      - name: Install deployment transaction
        timeout-minutes: 10
        run: |
          bundle="chief-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          source_url="https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}"
          curl --fail --silent --show-error --location --retry 3 --max-time 60 \
            "$source_url" --output "/tmp/$bundle.tar.gz"
          bundle_sha="$(sha256sum "/tmp/$bundle.tar.gz" | cut -d ' ' -f 1)"
          gcloud compute ssh chief \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --zone="${{ vars.GCP_ZONE }}" \
            --tunnel-through-iap --quiet \
            --command="set -e
            for _ in \$(seq 1 60); do
              sudo test -f /etc/systemd/system/chief.service && break
              sleep 5
            done
            if ! sudo test -f /etc/systemd/system/chief.service; then
              sudo journalctl -u google-startup-scripts.service --no-pager --lines=100
              exit 1
            fi
            curl --fail --silent --show-error --location --retry 3 --max-time 60 \
              '$source_url' --output /tmp/$bundle.tar.gz
            echo '$bundle_sha  /tmp/$bundle.tar.gz' | sha256sum --check --status
            mkdir -m 0700 /tmp/$bundle
            tar -xzf /tmp/$bundle.tar.gz --strip-components=1 -C /tmp/$bundle
            sudo install -m 0750 /tmp/$bundle/scripts/configure-google-cloud-apt.sh /opt/chief/configure-google-cloud-apt.sh
            sudo /opt/chief/configure-google-cloud-apt.sh
            sudo install -m 0750 /tmp/$bundle/scripts/install-node.sh /opt/chief/install-node.sh
            sudo /opt/chief/install-node.sh
            sudo install -d -m 0750 /opt/chief/src/ops /opt/chief/gen/sql
            sudo install -m 0640 /tmp/$bundle/gen/sql/monitoring.ts /opt/chief/gen/sql/monitoring.ts
            sudo install -m 0640 /tmp/$bundle/src/ops/*.ts /opt/chief/src/ops/
            sudo /opt/chief/node/bin/node /opt/chief/src/ops/cli.ts install-services
            sudo /opt/chief/node/bin/node /opt/chief/src/ops/cli.ts install-monitoring \
              '${{ vars.DISCORD_MONITORING_CHANNEL_ID }}' \
              '${{ vars.DISCORD_GUILD_ID }}' \
              '${{ vars.GCP_PROJECT_ID }}'
            rm -rf /tmp/$bundle /tmp/$bundle.tar.gz
            sudo /opt/chief/node/bin/node /opt/chief/src/ops/cli.ts deploy \
              --image '${{ steps.image.outputs.reference }}' \
              --backup-bucket '${{ vars.CHIEF_BACKUP_BUCKET }}'"

      - name: Record deployment evidence
        env:
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
        run: |
          {
            echo '### Chief production deployment'
            echo "- Image: \`$IMAGE_REFERENCE\`"
            echo '- Terraform plan and apply used the same saved plan from this merged commit.'
          } >>"$GITHUB_STEP_SUMMARY"
